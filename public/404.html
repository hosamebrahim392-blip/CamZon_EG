<!DOCTYPE html>
<html lang="ar" dir="rtl">
  <head>
    <meta charset="utf-8">
    <title>CamZone-EG | إعادة التوجيه</title>
    <script>
      // Single Page Apps for GitHub Pages
      // Redirects 404 paths back to index.html with the route preserved
      var pathSegmentsToKeep = 1;
      var l = window.location;
      l.replace(
        l.protocol + '//' + l.hostname + (l.port ? ':' + l.port : '') +
        l.pathname.split('/').slice(0, 1 + pathSegmentsToKeep).join('/') + '/?p=/' +
        l.pathname.slice(1).split('/').slice(pathSegmentsToKeep).join('/').replace(/&/g, '~and~') +
        (l.search ? '&q=' + l.search.slice(1).replace(/&/g, '~and~') : '') +
        l.hash
      );
    </script>
  </head>
  <body style="background-color: #0b0c10; color: #fff; font-family: sans-serif; text-align: center; padding: 50px;">
    <h2>جاري تحميل CamZone-EG...</h2>
  </body>
</html>
