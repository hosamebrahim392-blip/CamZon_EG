<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#14171f"/>
      <stop offset="100%" stop-color="#0a0c10"/>
    </linearGradient>
    <linearGradient id="gold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f5d77f"/>
      <stop offset="50%" stop-color="#d4af37"/>
      <stop offset="100%" stop-color="#aa820a"/>
    </linearGradient>
    <linearGradient id="lens" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00a8ff"/>
      <stop offset="100%" stop-color="#0044ff"/>
    </linearGradient>
  </defs>
  
  <!-- Outer Rounded Container -->
  <rect width="512" height="512" rx="128" fill="url(#bg)"/>
  <rect x="12" y="12" width="488" height="488" rx="116" fill="none" stroke="url(#gold)" stroke-width="4" stroke-opacity="0.4"/>
  
  <!-- Shield Outline -->
  <path d="M256 70 L390 125 C390 280 256 390 256 425 C256 390 122 280 122 125 Z" 
        fill="#1a1e28" stroke="url(#gold)" stroke-width="8" stroke-linejoin="round"/>
        
  <!-- CCTV Camera Body Inside Shield -->
  <g transform="translate(146, 170)">
    <!-- Base Bracket -->
    <rect x="0" y="80" width="30" height="40" rx="6" fill="#3a4050"/>
    <path d="M30 95 L75 95 L95 110" stroke="#4b5563" stroke-width="12" fill="none" stroke-linecap="round"/>
    
    <!-- Camera Housing -->
    <path d="M75 50 L195 70 L195 130 L75 120 Z" fill="#2d3342" stroke="url(#gold)" stroke-width="5"/>
    <rect x="190" y="65" width="22" height="70" rx="4" fill="url(#gold)"/>
    
    <!-- Lens Circle & Iris -->
    <ellipse cx="205" cy="100" rx="8" ry="32" fill="#0f172a"/>
    <ellipse cx="206" cy="100" rx="5" ry="20" fill="url(#lens)"/>
    
    <!-- Red Rec Dot / Indicator -->
    <circle cx="95" cy="72" r="5" fill="#ef4444"/>
    
    <!-- Signal Wave Rays -->
    <path d="M225 80 A 25 25 0 0 1 225 120" stroke="url(#gold)" stroke-width="4" fill="none" stroke-linecap="round"/>
    <path d="M237 70 A 40 40 0 0 1 237 130" stroke="url(#gold)" stroke-width="4" fill="none" stroke-linecap="round" stroke-opacity="0.6"/>
  </g>
  
  <!-- Text Label Badge -->
  <rect x="176" y="405" width="160" height="34" rx="8" fill="#11141b" stroke="url(#gold)" stroke-width="2"/>
  <text x="256" y="428" font-family="'Cairo', sans-serif" font-size="18" font-weight="800" fill="url(#gold)" text-anchor="middle" letter-spacing="1">CamZone-EG</text>
</svg>
